<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Pages, Render and TiDB deployment flow</title>
  <desc id="desc">The browser loads static assets from GitHub Pages and API data from Render, which persists business data in TiDB.</desc>
  <rect width="1200" height="520" fill="#f4f4f5"/>
  <rect x="40" y="40" width="1120" height="440" fill="none" stroke="#18181b" stroke-width="8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="160" width="260" height="190" fill="#18181b"/>
    <text x="220" y="230" fill="#eab308" font-size="34" font-weight="900">GITHUB PAGES</text>
    <text x="220" y="278" fill="#fafafa" font-size="25" font-weight="700">Vue + 静态图片</text>
    <text x="220" y="316" fill="#a1a1aa" font-size="20">/repo/ 子路径</text>

    <rect x="470" y="160" width="260" height="190" fill="#eab308"/>
    <text x="600" y="230" fill="#18181b" font-size="34" font-weight="900">RENDER</text>
    <text x="600" y="278" fill="#18181b" font-size="25" font-weight="700">FastAPI / JWT</text>
    <text x="600" y="316" fill="#3f3f46" font-size="20">临时文件系统</text>

    <rect x="850" y="160" width="260" height="190" fill="#18181b"/>
    <text x="980" y="230" fill="#eab308" font-size="34" font-weight="900">TIDB CLOUD</text>
    <text x="980" y="278" fill="#fafafa" font-size="25" font-weight="700">用户 / 文章 / 互动</text>
    <text x="980" y="316" fill="#a1a1aa" font-size="20">TLS 持久化</text>
  </g>
  <g stroke="#18181b" stroke-width="10" fill="none" marker-end="url(#arrow)">
    <path d="M350 255h110"/>
    <path d="M730 255h110"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#18181b"/>
    </marker>
  </defs>
  <text x="600" y="440" fill="#52525b" text-anchor="middle" font-family="monospace" font-size="20">图片走 Pages 静态资源，业务数据走 TiDB，避免依赖 Render 临时磁盘</text>
</svg>
